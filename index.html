    <main class="pos-relative">
      <section
        id="hero"
        class="hero d-grid pos-relative overflow-hidden flex-column text-center"

        <div class="hero-content pos-relative z-3">
          <div class="role">Product & UX/UI Designer</div>
          <h1><em>creative universe</em></h1>
        </div>
        <div
          class="hands-container d-flex pos-relative z-1"
          id="handsContainer"
        >
          <div class="hand left">
            <img
              src="./images/hero_leftHand.webp"
              alt=""
              fetchpriority="high"
              decoding="async"
            />
          </div>
          <div class="hand right">
            <img
              src="./images/hero_rightHand.webp"
              alt=""
              fetchpriority="high"
              decoding="async"
            />
          </div>
        </div>
        <div
          class="scroll-hint d-flex pos-absolute flex-column align-items-center z-3"
        >
          <span class="falling-star"></span>
          <p>Explorar</p>
        </div>
        <div class="scroll-cue pos-absolute z-3"></div>
      </section>
